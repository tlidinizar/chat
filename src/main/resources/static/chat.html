<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>S.A.T - Global Chat</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --p-yellow: #ffcc00;
            --p-grey: #475569; /* اللون الرمادي الاحترافي */
            --bg-main: #ffffff;
            --sidebar-bg: #f8fafc;
            --border: #e2e8f0;
            --text-dark: #1e293b;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            height: 100vh;
            background: var(--bg-main);
            color: var(--text-dark);
            background-image: radial-gradient(var(--border) 1px, transparent 0);
            background-size: 30px 30px;
        }

        /* ── Sidebar ── */
        .sidebar {
            width: 300px;
            background: white;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .sidebar-header {
            padding: 24px;
            background: var(--p-grey); 
            color: var(--p-yellow);
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-header span {
            background: var(--p-yellow);
            color: var(--p-grey);
            padding: 2px 6px;
            border-radius: 4px;
        }

        #online-users-list { flex: 1; overflow-y: auto; padding: 15px; }

        .user-item { 
            padding: 12px 16px; 
            border-radius: 12px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            transition: 0.2s; 
            margin-bottom: 6px;
            border: 1px solid transparent;
        }
        .user-item:hover { 
            background: var(--sidebar-bg); 
            border-color: var(--border);
        }

        .status-dot { 
            width: 8px; 
            height: 8px; 
            background: #10b981; 
            border-radius: 50%; 
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.4); 
        }

        /* ── Main Chat Area ── */
        .chat-area { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            background: rgba(255, 255, 255, 0.8); 
            backdrop-filter: blur(4px); 
        }

        .chat-header { 
            padding: 20px 30px; 
            background: white; 
            border-bottom: 1px solid var(--border); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }

        .chat-header .title {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            letter-spacing: 1px;
        }

        #user-display-name {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            background: var(--sidebar-bg);
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        #messages { flex: 1; overflow-y: auto; padding: 30px; display: flex; flex-direction: column; gap: 15px; }

        /* ── Message Bubbles ── */
        .msg { 
            padding: 12px 18px; 
            border-radius: 16px; 
            font-size: 14px; 
            line-height: 1.5; 
            position: relative; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.02); 
        }

        .msg-group { display: flex; flex-direction: column; max-width: 70%; }
        .msg-group.me { align-self: flex-end; align-items: flex-end; }
        .msg-group.other { align-self: flex-start; align-items: flex-start; }

        .msg-group.me .msg { 
            background: var(--p-grey); 
            color: white; 
            border-bottom-right-radius: 4px; 
        }

        .msg-group.other .msg { 
            background: white; 
            border: 1px solid var(--border); 
            color: var(--text-dark);
            border-bottom-left-radius: 4px; 
        }

        .sender-label { 
            font-size: 11px; 
            font-weight: 700; 
            margin-bottom: 4px; 
            color: var(--text-muted); 
            font-family: 'JetBrains Mono', monospace; 
        }

        .deleted-msg { font-style: italic; opacity: 0.7; }
        .edited-tag { font-size: 10px; margin-left: 5px; opacity: 0.6; }

        .msg-actions { margin-top: 4px; display: flex; gap: 8px; }
        .msg-actions button {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'JetBrains Mono';
            transition: 0.2s;
        }
        .msg-actions button:hover { background: var(--p-grey); color: white; }

        /* ── Input Bar ── */
        .input-bar {
            padding: 20px 30px;
            background: white;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 15px;
            align-items: center;
        }

        #msg-input {
            flex: 1;
            padding: 14px 20px;
            border: 1px solid var(--border);
            border-radius: 12px;
            outline: none;
            background: var(--sidebar-bg);
            transition: 0.2s;
        }
        #msg-input:focus { border-color: var(--p-grey); background: white; }

        #send-btn {
            background: var(--p-grey); 
            color: var(--p-yellow);
            border: none;
            padding: 0 30px;
            height: 48px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 800;
            font-family: 'JetBrains Mono', monospace;
            transition: 0.3s;
        }
        #send-btn:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 5px 15px rgba(71, 85, 105, 0.2); 
        }

        /* ── Notifications ── */
        #notif-container {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background: white;
            width: 50px;
            height: 50px;
            border-radius: 15px;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            cursor: pointer;
            z-index: 100;
            border: 1px solid var(--border);
        }

        #notif-badge {
            position: absolute; 
            top: -5px; 
            right: -5px; 
            background: var(--p-grey); 
            color: white; 
            border-radius: 50%; 
            padding: 2px 6px; 
            font-size: 10px; 
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <span>NODE</span> ACTIVE_USERS
        </div>
        <div id="online-users-list"></div>
    </div>

    <div class="chat-area">
        <div class="chat-header">
            <div class="title">GLOBAL_COMM_CHANNEL</div>
            <span id="user-display-name">ID: Loading...</span>
        </div>
        
        <div id="messages"></div>

        <div class="input-bar">
            <input type="text" id="msg-input" placeholder="Type_Secure_Message..." autocomplete="off">
            <button id="send-btn" onclick="send()">PUSH_DATA</button>
        </div>
    </div>

    <div id="notif-container" onclick="goToPrivate()">
        <span id="notif-badge">0</span>
        <span style="font-size:20px;">🔔</span>
    </div>

    <script>
        // --- Logic كيبقى هو هو باش ما يتخربقش الربط مع الباكيند ---
        let stompClient   = null;
        let privateClient = null;
        let lastSenderName = "";
        const unreadCounts = {};
        let totalUnread = 0;
        let lastRenderedSender = null;
        let lastRenderedGroup  = null;

        const currentUser = {
            email:     (localStorage.getItem('chatUser')      || "").trim(),
            firstName: (localStorage.getItem('userFirstName') || "").trim(),
            lastName:  (localStorage.getItem('userLastName')  || "").trim()
        };
        const myFullName = `${currentUser.firstName} ${currentUser.lastName}`.trim();

        document.getElementById('user-display-name').innerText = `ID: ${myFullName || "Unknown_Operator"}`;

        function connect() {
            const headers = { login: currentUser.email, firstName: currentUser.firstName, lastName: currentUser.lastName };
            const socket = new SockJS('http://localhost:8081/ws-chat');
            stompClient = Stomp.over(socket);
            stompClient.debug = null;

            stompClient.connect(headers, () => {
                stompClient.subscribe('/topic/online-users', (res) => updateOnlineList(JSON.parse(res.body)));
                stompClient.subscribe('/topic/messages', (msg) => showMsg(JSON.parse(msg.body)));
                stompClient.send("/app/getOnlineUsers", {}, {});
            }, () => setTimeout(connect, 5000));

            const wsPrivate = new SockJS('http://localhost:8081/ws-chat?name=' + encodeURIComponent(myFullName));
            privateClient = Stomp.over(wsPrivate);
            privateClient.debug = null;
            privateClient.connect(headers, () => {
                privateClient.subscribe('/user/queue/notifications', (frame) => {
                    const parts = frame.body.split('|');
                    const sender = parts[1] ? parts[1].trim() : parts[0].replace('Nouveau message de ', '').trim();
                    unreadCounts[sender] = (unreadCounts[sender] || 0) + 1;
                    updateBadge(sender);
                    lastSenderName = sender;
                    totalUnread++;
                    document.getElementById('notif-container').style.display = 'flex';
                    document.getElementById('notif-badge').innerText = totalUnread;
                });
            });
        }

        function send() {
            const input = document.getElementById('msg-input');
            if (!input.value.trim() || !stompClient) return;
            stompClient.send("/app/sendMessage", {}, JSON.stringify({
                sender: myFullName, firstName: currentUser.firstName, lastName: currentUser.lastName,
                content: input.value.trim(), type: 'CHAT', timestamp: new Date()
            }));
            input.value = "";
        }

        function showMsg(data) {
            const area = document.getElementById('messages');
            const isMe = data.sender === myFullName;
            const side = isMe ? 'me' : 'other';
            const senderKey = data.sender || `${data.firstName} ${data.lastName}`;

            const existingBubble = document.getElementById('bubble-' + data.id);
            if (existingBubble) {
                existingBubble.querySelector('.content-text').innerHTML = data.deleted ? 
                    '<span class="deleted-msg">Message_Deleted_By_User</span>' : 
                    `${data.content}${data.edited ? '<span class="edited-tag">(edited)</span>' : ''}`;
                return;
            }

            if (lastRenderedSender !== senderKey) {
                lastRenderedGroup = document.createElement('div');
                lastRenderedGroup.className = `msg-group ${side}`;
                if (!isMe) lastRenderedGroup.innerHTML = `<span class="sender-label">${senderKey}</span>`;
                area.appendChild(lastRenderedGroup);
                lastRenderedSender = senderKey;
            }

            const bubbleWrap = document.createElement('div');
            bubbleWrap.style.display = "flex";
            bubbleWrap.style.flexDirection = "column";
            bubbleWrap.style.alignItems = isMe ? "flex-end" : "flex-start";

            const bubble = document.createElement('div');
            bubble.id = 'bubble-' + data.id;
            bubble.className = 'msg';
            bubble.innerHTML = `<div class="content-text">${data.deleted ? '<span class="deleted-msg">Message_Deleted_By_User</span>' : data.content + (data.edited ? '<span class="edited-tag">(edited)</span>' : '')}</div>`;
            
            bubbleWrap.appendChild(bubble);

            if (isMe && !data.deleted) {
                const actions = document.createElement('div');
                actions.className = 'msg-actions';
                actions.innerHTML = `<button onclick="promptEdit(${data.id}, '${data.content.replace(/'/g, "\\'")}')">Edit</button>
                                     <button onclick="sendDelete(${data.id})">Delete</button>`;
                bubbleWrap.appendChild(actions);
            }

            lastRenderedGroup.appendChild(bubbleWrap);
            area.scrollTop = area.scrollHeight;
        }

        function promptEdit(id, oldContent) {
            const newContent = prompt("Update Command:", oldContent);
            if (newContent && newContent.trim() !== oldContent) {
                stompClient.send("/app/editMessage", {}, JSON.stringify({ id: id.toString(), content: newContent.trim(), sender: myFullName }));
            }
        }

        function sendDelete(id) {
            if (confirm("Confirm_Deletion?")) {
                stompClient.send("/app/deleteMessage", {}, JSON.stringify({ id: id.toString(), sender: myFullName }));
            }
        }

        function updateOnlineList(fullNames) {
            const list = document.getElementById('online-users-list');
            list.innerHTML = '';
            [...new Set(fullNames)].filter(name => name !== myFullName).forEach(name => {
                const div = document.createElement('div');
                div.className = 'user-item';
                div.onclick = () => openPrivateChat(name);
                div.innerHTML = `<div class="status-dot"></div><span class="user-name">${name}</span>`;
                list.appendChild(div);
            });
        }

        function openPrivateChat(name) {
            window.location.href = `chat_private.html?name=${encodeURIComponent(name)}`;
        }

        function goToPrivate() { if (lastSenderName) openPrivateChat(lastSenderName); }

        document.getElementById("msg-input").addEventListener("keypress", (e) => { if (e.key === "Enter") send(); });
        connect();
    </script>
</body>
</html>
