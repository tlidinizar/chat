<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>S.A.T - Global Chat</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --p-yellow: #ffcc00;
            --p-grey: #475569;
            --bg-main: #ffffff;
            --sidebar-bg: #f8fafc;
            --border: #e2e8f0;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --danger: #dc2626;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            height: 100vh;
            background: var(--bg-main);
            color: var(--text-dark);
            background-image: radial-gradient(var(--border) 1px, transparent 0);
            background-size: 30px 30px;
        }

        .sidebar {
            width: 300px;
            background: white;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .sidebar-header {
            padding: 24px;
            background: var(--p-grey);
            color: var(--p-yellow);
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-header span {
            background: var(--p-yellow);
            color: var(--p-grey);
            padding: 2px 6px;
            border-radius: 4px;
        }

        #online-users-list { 
            flex: 1; 
            overflow-y: auto; 
            padding: 15px; 
        }

        .user-item { 
            padding: 12px 16px; 
            border-radius: 12px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            transition: 0.2s; 
            margin-bottom: 6px;
            border: 1px solid transparent;
            position: relative;
        }
        .user-item:hover { 
            background: var(--sidebar-bg); 
            border-color: var(--border);
        }

        .status-dot { 
            width: 8px; 
            height: 8px; 
            border-radius: 50%; 
            flex-shrink: 0;
        }
        .status-dot.online {
            background: #10b981;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
        }

        .user-name {
            flex: 1;
            font-size: 14px;
            font-weight: 500;
        }

        .unread-count {
            background: #ef4444;
            color: white;
            border-radius: 20px;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: bold;
            min-width: 20px;
            text-align: center;
        }

        .sidebar-footer {
            padding: 15px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-sidebar {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            font-size: 13px;
            text-align: center;
        }

        .btn-admin {
            background: var(--p-grey);
            color: var(--p-yellow);
        }

        .btn-admin:hover {
            transform: translateY(-2px);
        }

        .btn-logout {
            background: var(--danger);
            color: white;
        }

        .btn-logout:hover {
            background: #b91c1c;
            transform: translateY(-2px);
        }

        .chat-area { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            background: rgba(255, 255, 255, 0.8); 
            backdrop-filter: blur(4px); 
        }

        .chat-header { 
            padding: 20px 30px; 
            background: white; 
            border-bottom: 1px solid var(--border); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }

        .chat-header .title {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            letter-spacing: 1px;
        }

        #user-display-name {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            background: var(--sidebar-bg);
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #user-avatar-small {
            width: 30px;
            height: px;
            border-radius: 50%;
            object-fit: cover;
        }

        .settings-icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            transition: 0.2s;
        }

        .settings-icon-btn:hover {
            background: var(--sidebar-bg);
        }

        #messages { 
            flex: 1; 
            overflow-y: auto; 
            padding: 30px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        }

        .msg { 
            padding: 12px 18px; 
            border-radius: 16px; 
            font-size: 14px; 
            line-height: 1.5; 
            position: relative; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.02); 
        }

        .msg-group { 
            display: flex; 
            flex-direction: column; 
            max-width: 70%; 
        }
        .msg-group.me { 
            align-self: flex-end; 
            align-items: flex-end; 
        }
        .msg-group.other { 
            align-self: flex-start; 
            align-items: flex-start; 
        }

        .msg-group.me .msg { 
            background: var(--p-grey); 
            color: white; 
            border-bottom-right-radius: 4px; 
        }

        .msg-group.other .msg { 
            background: white; 
            border: 1px solid var(--border); 
            color: var(--text-dark);
            border-bottom-left-radius: 4px; 
        }

        .sender-label { 
            font-size: 11px; 
            font-weight: 700; 
            margin-bottom: 4px; 
            color: var(--text-muted); 
            font-family: 'JetBrains Mono', monospace; 
        }

        .deleted-msg { 
            font-style: italic; 
            opacity: 0.7; 
        }
        .edited-tag { 
            font-size: 10px; 
            margin-left: 5px; 
            opacity: 0.6; 
        }

        .msg-actions { 
            margin-top: 4px; 
            display: flex; 
            gap: 8px; 
        }
        .msg-actions button {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'JetBrains Mono';
            transition: 0.2s;
        }
        .msg-actions button:hover { 
            background: var(--p-grey); 
            color: white; 
        }

        .input-bar {
            padding: 20px 30px;
            background: white;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 15px;
            align-items: center;
        }

        #msg-input {
            flex: 1;
            padding: 14px 20px;
            border: 1px solid var(--border);
            border-radius: 12px;
            outline: none;
            background: var(--sidebar-bg);
            transition: 0.2s;
        }
        #msg-input:focus { 
            border-color: var(--p-grey); 
            background: white; 
        }

        #send-btn {
            background: var(--p-grey); 
            color: var(--p-yellow);
            border: none;
            padding: 0 30px;
            height: 48px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 800;
            font-family: 'JetBrains Mono', monospace;
            transition: 0.3s;
        }
        #send-btn:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 5px 15px rgba(71, 85, 105, 0.2); 
        }

        #notif-container {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background: white;
            width: 50px;
            height: 50px;
            border-radius: 15px;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            cursor: pointer;
            z-index: 100;
            border: 1px solid var(--border);
        }

        #notif-badge {
            position: absolute; 
            top: -5px; 
            right: -5px; 
            background: #ef4444; 
            color: white; 
            border-radius: 50%; 
            padding: 2px 6px; 
            font-size: 10px; 
            font-weight: bold;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: white;
            border-radius: 20px;
            width: 450px;
            max-width: 90%;
            padding: 30px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.2);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        .modal-header h2 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 18px;
            color: var(--p-grey);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-muted);
            transition: 0.2s;
        }

        .modal-close:hover {
            color: var(--danger);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-family: 'JetBrains Mono', monospace;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            transition: 0.2s;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--p-grey);
            box-shadow: 0 0 0 3px rgba(71, 85, 105, 0.1);
        }

        .avatar-preview {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .avatar-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--p-grey);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--p-yellow);
            font-size: 40px;
            font-weight: bold;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            transition: 0.2s;
            overflow: hidden;
        }

        .avatar-circle:hover {
            transform: scale(1.05);
        }

        .avatar-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .modal-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn-cancel {
            background: var(--sidebar-bg);
            color: var(--text-dark);
        }

        .btn-cancel:hover {
            background: var(--border);
        }

        .btn-save {
            background: var(--p-grey);
            color: var(--p-yellow);
        }

        .btn-save:hover {
            transform: translateY(-2px);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--success);
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            z-index: 1100;
            opacity: 0;
            transform: translateX(100px);
            transition: all 0.3s ease;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(0);
        }
		
		
		
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <span>SAT</span> ACTIVE_USERS
        </div>
        <div id="online-users-list"></div>

        <div class="sidebar-footer">
            <div id="adminButtonContainer" style="display: none;">
                <button class="btn-sidebar btn-admin" onclick="goToAdmin()">
                    👑 ADMIN PANEL
                </button>
            </div>
            <button class="btn-sidebar btn-logout" onclick="logout()">
                🚪 DÉCONNEXION
            </button>
        </div>
    </div>

    <div class="chat-area">
        <div class="chat-header">
            <div class="title" style="display:flex; align-items:center; gap:10px;">
                <img id="header-avatar" style="display:none; width:36px; height:36px; border-radius:50%; object-fit:cover; border:2px solid var(--border);">
                GLOBAL_COMM_CHANNEL
            </div>
			
			
            <span id="user-display-name">
                <img id="user-avatar-small" style="display:none;">
                <span id="user-name-text">Loading...</span>
            </span>
            <button onclick="openProfileModal()" class="settings-icon-btn">
                ⚙️
            </button>
        </div>
        
        <div id="messages"></div>

        <div class="input-bar">
            <input type="text" id="msg-input" placeholder="Type_Secure_Message..." autocomplete="off">
            <button id="send-btn" onclick="send()">Send</button>
        </div>
    </div>

    <div id="notif-container" onclick="goToPrivate()">
        <span id="notif-badge">0</span>
        <span style="font-size:20px;">✉️</span>
    </div>

    <!-- MODAL MODIFICATION PROFIL -->
    <div id="profileModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2>✏️ MODIFIER MON PROFIL</h2>
                <button class="modal-close" onclick="closeProfileModal()">&times;</button>
            </div>
            
            <div class="avatar-preview">
                <div class="avatar-circle" id="avatarPreview" onclick="document.getElementById('avatarFile').click()">
                    <span id="avatarInitials">NT</span>
                    <img id="avatarImg" style="display: none;" alt="Avatar">
                </div>
            </div>
            <input type="file" id="avatarFile" accept="image/*" style="display: none;" onchange="handleAvatarUpload(this)">

            <div class="form-group">
                <label>📝 Prénom</label>
                <input type="text" id="profileFirstName" placeholder="Votre prénom">
            </div>

            <div class="form-group">
                <label>📝 Nom</label>
                <input type="text" id="profileLastName" placeholder="Votre nom">
            </div>

            <div class="form-group">
                <label>📧 Email</label>
                <input type="email" id="profileEmail" placeholder="votre@email.com">
            </div>

            <div class="form-group">
                <label>🔒 Mot De Passe</label>
                <input type="password" id="profilePassword" placeholder="Nouveau mot de passe (optionnel)">
            </div>

            <div class="form-group">
                <label>🖼️ Avatar URL</label>
                <input type="url" id="avatarUrlInput" placeholder="https://exemple.com/avatar.jpg" oninput="handleAvatarUrl(this.value)">
            </div>

            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeProfileModal()">ANNULER</button>
                <button class="btn-save" onclick="saveProfile()">ENREGISTRER</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">✅ Profil mis à jour !</div>

    <script>
        let stompClient = null;
        let privateClient = null;
        let lastSenderName = "";
        let currentOnlineUsers = [];
        let unreadMessages = {};
        let totalUnread = 0;
        let lastRenderedSender = null;
        let lastRenderedGroup = null;

        // ========== FONCTIONS POUR LA GESTION DE L'AVATAR AVEC USER ID ==========
        
        // حفظ الصورة بـ userId
        function saveAvatarWithUserId(avatarUrl) {
            const userId = currentUser.id;
            if (userId && avatarUrl) {
                localStorage.setItem(`avatar_${userId}`, avatarUrl);
                console.log('✅ Avatar saved for user:', userId);
            }
        }

        // استرجاع الصورة بـ userId
        function loadAvatarByUserId() {
            const userId = currentUser.id;
            if (userId) {
                const savedAvatar = localStorage.getItem(`avatar_${userId}`);
                if (savedAvatar && savedAvatar !== '') {
                    currentUser.avatarUrl = savedAvatar;
                    localStorage.setItem('userAvatarUrl', savedAvatar);
                    console.log('✅ Avatar loaded for user:', userId);
                    return true;
                }
            }
            console.log('❌ No avatar found for user:', userId);
            return false;
        }

        // معلومات المستخدم
        const storedEnabled = localStorage.getItem('userEnabled');
        if (!localStorage.getItem('chatUser')) {
            window.location.href = 'login.html';
        }
        if (storedEnabled === 'false') {
            window.location.href = 'waiting.html';
        }

        let currentUser = {
            id: localStorage.getItem('userId') ? parseInt(localStorage.getItem('userId')) : 1,
            email: (localStorage.getItem('chatUser') || "").trim(),
            firstName: (localStorage.getItem('userFirstName') || "").trim(),
            lastName: (localStorage.getItem('userLastName') || "").trim(),
            avatarUrl: (localStorage.getItem('userAvatarUrl') || "").trim()
        };
        
        // استرجاع الصورة من userId عند تحميل الصفحة
        loadAvatarByUserId();
        
        let myFullName = `${currentUser.firstName} ${currentUser.lastName}`.trim();
        
        // تحديث العرض
        function updateUserDisplay() {
            const nameSpan = document.getElementById('user-name-text');
            const avatarImg = document.getElementById('user-avatar-small');
            const headerAvatar = document.getElementById('header-avatar');
            nameSpan.textContent = `ID: ${myFullName}`;
            
            if (currentUser.avatarUrl && currentUser.avatarUrl !== '') {
                avatarImg.src = currentUser.avatarUrl;
                avatarImg.style.display = 'inline-block';
                avatarImg.style.width = '24px';
                avatarImg.style.height = '24px';
                avatarImg.style.borderRadius = '50%';
                avatarImg.style.marginRight = '8px';
                // تحديث الصورة قبل GLOBAL_COMM_CHANNEL
                if (headerAvatar) {
                    headerAvatar.src = currentUser.avatarUrl;
                    headerAvatar.style.display = 'inline-block';
                }
                // حفظ الصورة بـ userId
                saveAvatarWithUserId(currentUser.avatarUrl);
            } else {
                avatarImg.style.display = 'none';
                if (headerAvatar) headerAvatar.style.display = 'none';
            }
        }
        
        updateUserDisplay();

        // التحقق من دور المستخدم
        const userRole = localStorage.getItem('userRole');
        if (userRole === 'ADMIN') {
            const adminBtn = document.getElementById('adminButtonContainer');
            if (adminBtn) adminBtn.style.display = 'block';
        }

        // ========== FONCTIONS DU MODAL ==========
        
        function openProfileModal() {
            document.getElementById('profileFirstName').value = currentUser.firstName;
            document.getElementById('profileLastName').value = currentUser.lastName;
            document.getElementById('profileEmail').value = currentUser.email;
            document.getElementById('profilePassword').value = '';
            document.getElementById('avatarUrlInput').value = currentUser.avatarUrl || '';
            
            updateModalAvatarPreview();
            document.getElementById('profileModal').classList.add('active');
        }

        function closeProfileModal() {
            document.getElementById('profileModal').classList.remove('active');
        }

        function updateModalAvatarPreview() {
            const avatarImg = document.getElementById('avatarImg');
            const avatarInitials = document.getElementById('avatarInitials');
            const avatarUrl = currentUser.avatarUrl;
            
            if (avatarUrl && avatarUrl.trim() !== '') {
                avatarImg.src = avatarUrl;
                avatarImg.style.display = 'block';
                avatarInitials.style.display = 'none';
            } else {
                const initials = `${currentUser.firstName.charAt(0)}${currentUser.lastName.charAt(0)}`.toUpperCase();
                avatarInitials.textContent = initials || '??';
                avatarInitials.style.display = 'flex';
                avatarImg.style.display = 'none';
            }
        }

        function handleAvatarUpload(input) {
            const file = input.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const avatarUrl = e.target.result;
                document.getElementById('avatarUrlInput').value = avatarUrl;
                handleAvatarUrl(avatarUrl);
            };
            reader.readAsDataURL(file);
        }

        function handleAvatarUrl(url) {
            const avatarImg = document.getElementById('avatarImg');
            const avatarInitials = document.getElementById('avatarInitials');
            
            if (url && url.trim() !== '') {
                avatarImg.src = url;
                avatarImg.style.display = 'block';
                avatarInitials.style.display = 'none';
            } else {
                const firstName = document.getElementById('profileFirstName').value;
                const lastName = document.getElementById('profileLastName').value;
                const initials = `${firstName.charAt(0)}${lastName.charAt(0)}`.toUpperCase();
                avatarInitials.textContent = initials || '??';
                avatarInitials.style.display = 'flex';
                avatarImg.style.display = 'none';
            }
        }

        // ========== FONCTION SAVE PROFILE AVEC PATCH ==========
        async function saveProfile() {
            // نجمع فقط الحقول اللي غيرها المستخدم
            const updates = {};
            
            const newFirstName = document.getElementById('profileFirstName').value.trim();
            const newLastName = document.getElementById('profileLastName').value.trim();
            const newEmail = document.getElementById('profileEmail').value.trim();
            const newPassword = document.getElementById('profilePassword').value;
            const newAvatarUrl = document.getElementById('avatarUrlInput').value.trim();
            
            // نضيف فقط الحقول اللي تغيرت
            if (newFirstName !== currentUser.firstName) {
                updates.firstName = newFirstName;
            }
            if (newLastName !== currentUser.lastName) {
                updates.lastName = newLastName;
            }
            if (newEmail !== currentUser.email) {
                updates.email = newEmail;
            }
            if (newPassword && newPassword.trim() !== '') {
                updates.password = newPassword;
            }
            if (newAvatarUrl !== currentUser.avatarUrl) {
                updates.avatarUrl = newAvatarUrl;
            }
            
            // إذا ما كاين حتى تعديل
            if (Object.keys(updates).length === 0) {
                showToast('Aucune modification détectée', 'info');
                closeProfileModal();
                return;
            }
            
            try {
                // استعمال PATCH بدل PUT
                const response = await fetch(`/profile/${currentUser.id}`, {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(updates)
                });
                
                if (response.ok) {
                    const result = await response.json();
                    
                    // تحديث localStorage فقط للحقول اللي تغيرت
                    if (updates.firstName) localStorage.setItem('userFirstName', updates.firstName);
                    if (updates.lastName) localStorage.setItem('userLastName', updates.lastName);
                    if (updates.email) localStorage.setItem('chatUser', updates.email);
                    if (updates.avatarUrl) {
                        localStorage.setItem('userAvatarUrl', updates.avatarUrl);
                        // حفظ الصورة بـ userId
                        saveAvatarWithUserId(updates.avatarUrl);
                    }
                    
                    // تحديث المتغيرات
                    if (updates.firstName) currentUser.firstName = updates.firstName;
                    if (updates.lastName) currentUser.lastName = updates.lastName;
                    if (updates.email) currentUser.email = updates.email;
                    if (updates.avatarUrl) currentUser.avatarUrl = updates.avatarUrl;
                    
                    myFullName = `${currentUser.firstName} ${currentUser.lastName}`.trim();
                    
                    // تحديث العرض
                    updateUserDisplay();
                    updateModalAvatarPreview();
                    
                    closeProfileModal();
                    showToast('✅ ' + result.message, 'success');
                    
                    // تفريغ حقل كلمة السر
                    document.getElementById('profilePassword').value = '';
                    
                    // إعادة تحميل الصفحة بعد 1.5 ثانية
                    setTimeout(() => {
                        location.reload();
                    }, 1500);
                } else {
                    const error = await response.json();
                    showToast('❌ ' + error.error, 'error');
                }
            } catch (error) {
                console.error('Erreur:', error);
                showToast('❌ Erreur de connexion au serveur', 'error');
            }
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.background = type === 'success' ? '#10b981' : '#dc2626';
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
                toast.style.background = '#10b981';
            }, 3000);
        }

        // Fermer le modal en cliquant en dehors
        document.getElementById('profileModal').addEventListener('click', function(e) {
            if (e.target === this) closeProfileModal();
        });

        // ========== FONCTIONS CHAT ==========
        
        function logout() {
            // حفظ الصورة قبل الخروج بـ userId
            if (currentUser.avatarUrl) {
                saveAvatarWithUserId(currentUser.avatarUrl);
            }
            
            if (stompClient && stompClient.connected) stompClient.disconnect();
            if (privateClient && privateClient.connected) privateClient.disconnect();
            
            // حفظ كل الصور المرتبطة بـ userId قبل المسح
            const savedAvatars = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('avatar_')) {
                    savedAvatars[key] = localStorage.getItem(key);
                }
            }
            
            localStorage.clear();
            
            // استرجاع الصور المحفوظة
            for (const [key, value] of Object.entries(savedAvatars)) {
                localStorage.setItem(key, value);
            }
            
            window.location.href = "login.html";
        }

        function goToAdmin() {
            window.location.href = "admin.html";
        }

        function connect() {
            const headers = { 
                login: currentUser.email, 
                firstName: currentUser.firstName, 
                lastName: currentUser.lastName 
            };
            const socket = new SockJS('http://localhost:8081/ws-chat');
            stompClient = Stomp.over(socket);
            stompClient.debug = null;

            stompClient.connect(headers, () => {
                stompClient.subscribe('/topic/online-users', (res) => {
                    currentOnlineUsers = JSON.parse(res.body);
                    updateOnlineList(currentOnlineUsers);
                });
                stompClient.subscribe('/topic/messages', (msg) => showMsg(JSON.parse(msg.body)));
                stompClient.send("/app/getOnlineUsers", {}, {});
            }, () => setTimeout(connect, 5000));

            const wsPrivate = new SockJS('http://localhost:8081/ws-chat?name=' + encodeURIComponent(myFullName));
            privateClient = Stomp.over(wsPrivate);
            privateClient.debug = null;
            privateClient.connect(headers, () => {
                privateClient.subscribe('/user/queue/notifications', (frame) => {
                    let sender = "";
                    try {
                        const parts = frame.body.split('|');
                        sender = parts[1] ? parts[1].trim() : parts[0].replace('Nouveau message de ', '').trim();
                    } catch(e) {
                        sender = frame.body.trim();
                    }
                    
                    if (sender && sender !== myFullName) {
                        unreadMessages[sender] = (unreadMessages[sender] || 0) + 1;
                        totalUnread = Object.values(unreadMessages).reduce((a, b) => a + b, 0);
                        lastSenderName = sender;
                        updateOnlineList(currentOnlineUsers);
                        document.getElementById('notif-container').style.display = 'flex';
                        document.getElementById('notif-badge').innerText = totalUnread;
                    }
                });
            });
        }

        function send() {
            const input = document.getElementById('msg-input');
            if (!input.value.trim() || !stompClient) return;
            stompClient.send("/app/sendMessage", {}, JSON.stringify({
                sender: myFullName, 
                firstName: currentUser.firstName, 
                lastName: currentUser.lastName,
                content: input.value.trim(), 
                type: 'CHAT', 
                timestamp: new Date()
            }));
            input.value = "";
        }

        function showMsg(data) {
            const area = document.getElementById('messages');
            const isMe = data.sender === myFullName;
            const side = isMe ? 'me' : 'other';
            const senderKey = data.sender || `${data.firstName} ${data.lastName}`;

            const existingBubble = document.getElementById('bubble-' + data.id);
            if (existingBubble) {
                existingBubble.querySelector('.content-text').innerHTML = data.deleted ? 
                    '<span class="deleted-msg">Message_Deleted_By_User</span>' : 
                    `${escapeHtml(data.content)}${data.edited ? '<span class="edited-tag">(edited)</span>' : ''}`;
                return;
            }

            if (lastRenderedSender !== senderKey) {
                lastRenderedGroup = document.createElement('div');
                lastRenderedGroup.className = `msg-group ${side}`;
                if (!isMe) lastRenderedGroup.innerHTML = `<span class="sender-label">${escapeHtml(senderKey)}</span>`;
                area.appendChild(lastRenderedGroup);
                lastRenderedSender = senderKey;
            }

            const bubbleWrap = document.createElement('div');
            bubbleWrap.style.display = "flex";
            bubbleWrap.style.flexDirection = "column";
            bubbleWrap.style.alignItems = isMe ? "flex-end" : "flex-start";

            const bubble = document.createElement('div');
            bubble.id = 'bubble-' + data.id;
            bubble.className = 'msg';
            bubble.innerHTML = `<div class="content-text">${data.deleted ? '<span class="deleted-msg">Message_Deleted_By_User</span>' : escapeHtml(data.content) + (data.edited ? '<span class="edited-tag">(edited)</span>' : '')}</div>`;
            
            bubbleWrap.appendChild(bubble);

            if (isMe && !data.deleted && data.id) {
                const actions = document.createElement('div');
                actions.className = 'msg-actions';
                actions.innerHTML = `<button onclick="promptEdit(${data.id}, '${(data.content || '').replace(/'/g, "\\'")}')">Edit</button>
                                     <button onclick="sendDelete(${data.id})">Delete</button>`;
                bubbleWrap.appendChild(actions);
            }

            lastRenderedGroup.appendChild(bubbleWrap);
            area.scrollTop = area.scrollHeight;
        }

        function promptEdit(id, oldContent) {
            const newContent = prompt("Update Command:", oldContent);
            if (newContent && newContent.trim() !== oldContent && stompClient) {
                stompClient.send("/app/editMessage", {}, JSON.stringify({ 
                    id: id.toString(), 
                    content: newContent.trim(), 
                    sender: myFullName 
                }));
            }
        }

        function sendDelete(id) {
            if (confirm("Confirm_Deletion?") && stompClient) {
                stompClient.send("/app/deleteMessage", {}, JSON.stringify({ 
                    id: id.toString(), 
                    sender: myFullName 
                }));
            }
        }

        function updateOnlineList(fullNames) {
            const list = document.getElementById('online-users-list');
            list.innerHTML = '';
            const users = [...new Set(fullNames)].filter(name => name !== myFullName);
            
            users.forEach(name => {
                const unreadCount = unreadMessages[name] || 0;
                const div = document.createElement('div');
                div.className = 'user-item';
                div.onclick = () => {
                    if (unreadMessages[name]) {
                        delete unreadMessages[name];
                        totalUnread = Object.values(unreadMessages).reduce((a, b) => a + b, 0);
                        if (totalUnread === 0) {
                            document.getElementById('notif-container').style.display = 'none';
                        }
                        document.getElementById('notif-badge').innerText = totalUnread;
                        updateOnlineList(fullNames);
                    }
                    openPrivateChat(name);
                };
                div.innerHTML = `
                    <div class="status-dot online"></div>
                    <span class="user-name">${escapeHtml(name)}</span>
                    ${unreadCount > 0 ? `<span class="unread-count">${unreadCount}</span>` : ''}
                `;
                list.appendChild(div);
            });
        }

        function openPrivateChat(name) {
            window.location.href = `chat_private.html?name=${encodeURIComponent(name)}`;
        }

        function goToPrivate() { 
            if (lastSenderName) openPrivateChat(lastSenderName); 
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById("msg-input").addEventListener("keypress", (e) => { 
            if (e.key === "Enter") send(); 
        });
        
        connect();
    </script>
</body>
</html>
